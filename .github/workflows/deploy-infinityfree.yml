name: Deploy to InfinityFree

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy website files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITY_FTP_USERNAME }}
          password: ${{ secrets.INFINITY_FTP_PASSWORD }}
          server-dir: /htdocs/
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.github/**
            **/docs/**
            **/tests/**
            **/backups/**
            **/logs/**
            **/InteriorDesign-SDOM/**
            **/database/**
            **/composer.json
            **/phpunit.xml
            **/README.md
            **/CHANGELOG.md
            **/.env.example
